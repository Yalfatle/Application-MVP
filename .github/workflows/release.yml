name: Publish app & website

# Builds the installable Android app and the admin website from
# app/config/public.json, then:
#   * attaches the APKs to the "Latest build" release (download on a phone
#     from the repo's Releases page), and
#   * publishes the website to GitHub Pages.
on:
  push:
    branches: [main, rebuild]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # One APK per phone type keeps the download small (~20 MB instead of ~50 MB).
      - run: flutter build apk --release --split-per-abi --dart-define-from-file=config/public.json
      - name: Name the files
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   Mukhtabarat.apk
          mv app-armeabi-v7a-release.apk Mukhtabarat-older-phones.apk
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            **Which file?** `Mukhtabarat.apk` works on almost every Android phone from the last ~8 years.
            Only if it says "app not installed", use `Mukhtabarat-older-phones.apk`.

            Your phone will ask to allow installing from your browser the first time; that's normal for apps outside the Play Store.
          files: |
            app/build/app/outputs/flutter-apk/Mukhtabarat.apk
            app/build/app/outputs/flutter-apk/Mukhtabarat-older-phones.apk
          fail_on_unmatched_files: true

  # Needs GitHub Pages switched on (Settings → Pages → Source: GitHub Actions),
  # and Pages only accepts the main branch.
  web:
    name: Admin website
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /Application-MVP/ --dart-define-from-file=config/public.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy-web:
    name: Publish website
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
